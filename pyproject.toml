[project]
name = "pvp-card-game"
version = "0.1.0"
description = "Online 2-player card game with simultaneous turn resolution"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.5.0",
    "websockets>=13.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["shared", "server", "client", "client.ui"]
